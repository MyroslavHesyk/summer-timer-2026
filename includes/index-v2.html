<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⏳ Таймер до літа 2026</title>
    <style>
        :root {
            --bg-deep: #0a0a1a;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --glow-gold: #ffb347;
            --glow-coral: #ff6b6b;
            --glow-amber: #ff9a3c;
            --glow-pink: #ff7eb3;
            --glow-sun: #ffe484;
            --font-display: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: var(--font-display);
            background: #0a0a1a;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== АНІМОВАНИЙ ФОН ===== */
        .bg-sky {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 140, 60, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 30% 20%, rgba(255, 100, 130, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 10%, rgba(255, 180, 70, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 60%, rgba(120, 60, 200, 0.2) 0%, transparent 60%),
                linear-gradient(180deg,
                    #0d0d2b 0%,
                    #15103a 15%,
                    #1a0f3c 30%,
                    #1e1040 45%,
                    #1a1038 60%,
                    #140e2e 75%,
                    #0c0a22 100%);
            animation: skyShift 20s ease-in-out infinite;
        }

        @keyframes skyShift {
            0%,
            100% {
                background:
                    radial-gradient(ellipse at 50% 0%, rgba(255, 140, 60, 0.35) 0%, transparent 55%),
                    radial-gradient(ellipse at 30% 20%, rgba(255, 100, 130, 0.25) 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 10%, rgba(255, 180, 70, 0.3) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 60%, rgba(120, 60, 200, 0.2) 0%, transparent 60%),
                    linear-gradient(180deg, #0d0d2b 0%, #15103a 15%, #1a0f3c 30%, #1e1040 45%, #1a1038 60%, #140e2e 75%, #0c0a22 100%);
            }
            25% {
                background:
                    radial-gradient(ellipse at 55% 2%, rgba(255, 160, 50, 0.38) 0%, transparent 55%),
                    radial-gradient(ellipse at 25% 18%, rgba(255, 120, 150, 0.22) 0%, transparent 50%),
                    radial-gradient(ellipse at 75% 8%, rgba(255, 190, 60, 0.28) 0%, transparent 50%),
                    radial-gradient(ellipse at 48% 55%, rgba(140, 70, 220, 0.18) 0%, transparent 60%),
                    linear-gradient(180deg, #0f0f30 0%, #17123e 15%, #1c1140 30%, #201242 45%, #1c123a 60%, #150f30 75%, #0d0b24 100%);
            }
            50% {
                background:
                    radial-gradient(ellipse at 45% 1%, rgba(255, 130, 70, 0.32) 0%, transparent 55%),
                    radial-gradient(ellipse at 35% 22%, rgba(255, 90, 120, 0.28) 0%, transparent 50%),
                    radial-gradient(ellipse at 65% 12%, rgba(255, 170, 80, 0.32) 0%, transparent 50%),
                    radial-gradient(ellipse at 52% 62%, rgba(100, 50, 190, 0.22) 0%, transparent 60%),
                    linear-gradient(180deg, #0c0c28 0%, #140f38 15%, #190e3a 30%, #1d0f3e 45%, #190f36 60%, #130d2c 75%, #0b0920 100%);
            }
            75% {
                background:
                    radial-gradient(ellipse at 52% 3%, rgba(255, 150, 55, 0.36) 0%, transparent 55%),
                    radial-gradient(ellipse at 28% 16%, rgba(255, 110, 140, 0.24) 0%, transparent 50%),
                    radial-gradient(ellipse at 72% 6%, rgba(255, 185, 65, 0.29) 0%, transparent 50%),
                    radial-gradient(ellipse at 49% 58%, rgba(130, 65, 210, 0.19) 0%, transparent 60%),
                    linear-gradient(180deg, #0e0e2d 0%, #16113c 15%, #1b103e 30%, #1f1141 45%, #1b1139 60%, #140e2e 75%, #0c0a23 100%);
            }
        }

        /* ===== ЗІРКИ (CSS) ===== */
        .stars-container {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: #ffffff;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
            opacity: 0;
            width: var(--size);
            height: var(--size);
            top: var(--top);
            left: var(--left);
            box-shadow: 0 0 var(--glow-radius) var(--glow-spread) rgba(255, 220, 180, 0.7);
        }
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.1;
                transform: scale(0.8);
            }
            30% {
                opacity: 0.9;
                transform: scale(1.4);
            }
            60% {
                opacity: 0.25;
                transform: scale(0.9);
            }
            85% {
                opacity: 0.7;
                transform: scale(1.25);
            }
        }

        /* ===== СОНЦЕ ===== */
        .sun-glow {
            position: fixed;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 340px;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle,
                    rgba(255, 240, 180, 0.9) 0%,
                    rgba(255, 200, 100, 0.6) 18%,
                    rgba(255, 150, 50, 0.3) 35%,
                    rgba(255, 100, 30, 0.1) 55%,
                    transparent 72%);
            animation: sunPulse 6s ease-in-out infinite;
            filter: blur(2px);
        }
        .sun-core {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle,
                    rgba(255, 255, 240, 1) 0%,
                    rgba(255, 240, 180, 0.9) 25%,
                    rgba(255, 200, 100, 0.5) 55%,
                    transparent 70%);
            animation: sunPulse 6s ease-in-out infinite;
            box-shadow:
                0 0 60px 30px rgba(255, 200, 100, 0.55),
                0 0 120px 60px rgba(255, 160, 60, 0.3),
                0 0 200px 90px rgba(255, 130, 40, 0.15);
        }
        @keyframes sunPulse {
            0%,
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 0.85;
            }
            40% {
                transform: translateX(-50%) scale(1.12);
                opacity: 1;
            }
            70% {
                transform: translateX(-50%) scale(1.04);
                opacity: 0.9;
            }
        }

        /* ===== КАНВАС ДЛЯ ЧАСТИНОК ===== */
        #particlesCanvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* ===== ОСНОВНИЙ КОНТЕЙНЕР ===== */
        .main-container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 140px;
            pointer-events: none;
        }
        .main-container>* {
            pointer-events: auto;
        }

        /* ===== ПЛАВАЮЧІ ЕМОДЖІ ===== */
        .floating-emoji {
            position: fixed;
            z-index: 2;
            pointer-events: none;
            font-size: var(--emoji-size);
            animation: floatUp var(--float-duration) linear infinite;
            animation-delay: var(--float-delay);
            left: var(--float-left);
            bottom: -60px;
            opacity: 0;
            filter: blur(0.5px);
            text-shadow: 0 0 18px rgba(255, 200, 150, 0.5);
        }
        @keyframes floatUp {
            0% {
                bottom: -60px;
                opacity: 0;
                transform: translateX(0) rotate(0deg) scale(0.6);
            }
            8% {
                opacity: 0.8;
            }
            15% {
                transform: translateX(15px) rotate(8deg) scale(1);
            }
            30% {
                transform: translateX(-10px) rotate(-5deg) scale(1.05);
            }
            50% {
                transform: translateX(18px) rotate(7deg) scale(0.95);
            }
            70% {
                transform: translateX(-14px) rotate(-6deg) scale(1.02);
            }
            85% {
                opacity: 0.5;
            }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(20px) rotate(12deg) scale(0.5);
            }
        }

        /* ===== ЗАГОЛОВОК ===== */
        .title-wrapper {
            text-align: center;
            margin-bottom: 10px;
            animation: titleEntrance 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(-30px);
        }
        @keyframes titleEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .title-icon {
            font-size: clamp(40px, 7vw, 64px);
            display: block;
            animation: iconBounce 2s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.6));
        }
        @keyframes iconBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-16px);
            }
            50% {
                transform: translateY(0);
            }
            75% {
                transform: translateY(-7px);
            }
        }
        .main-title {
            font-size: clamp(22px, 4.5vw, 36px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.04em;
            text-shadow:
                0 0 30px rgba(255, 180, 100, 0.5),
                0 0 60px rgba(255, 140, 60, 0.3),
                0 2px 4px rgba(0, 0, 0, 0.5);
            margin-top: 4px;
        }
        .summer-date-label {
            font-size: clamp(13px, 2.2vw, 16px);
            color: rgba(255, 220, 180, 0.75);
            letter-spacing: 0.06em;
            margin-top: 2px;
            font-weight: 400;
            text-shadow: 0 0 12px rgba(255, 160, 80, 0.4);
        }

        /* ===== ТАЙМЕР ===== */
        .timer-grid {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(12px, 2.5vw, 22px);
            justify-content: center;
            align-items: stretch;
            animation: timerEntrance 1s 0.3s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes timerEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timer-card {
            position: relative;
            background: var(--card-bg);
            border: 1.5px solid var(--card-border);
            border-radius: clamp(18px, 3vw, 26px);
            padding: clamp(18px, 3vw, 30px) clamp(16px, 2.8vw, 28px);
            min-width: clamp(75px, 16vw, 130px);
            text-align: center;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.04) inset;
            transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            overflow: hidden;
            user-select: none;
        }
        .timer-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%,
                    rgba(255, 255, 255, 0.06) 0%,
                    transparent 60%);
            pointer-events: none;
            transition: opacity 0.4s;
            opacity: 0.5;
        }
        .timer-card:hover {
            transform: translateY(-6px) scale(1.04);
            border-color: rgba(255, 200, 140, 0.45);
            box-shadow:
                0 16px 55px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(255, 150, 60, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .timer-card:hover::before {
            opacity: 0.8;
        }
        .timer-card:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }

        .timer-number {
            font-family: var(--font-mono);
            font-size: clamp(38px, 8vw, 72px);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.02em;
            text-shadow:
                0 0 25px var(--card-glow, rgba(255, 180, 100, 0.7)),
                0 0 50px var(--card-glow-2, rgba(255, 140, 60, 0.4)),
                0 0 80px var(--card-glow-3, rgba(255, 120, 40, 0.2));
            transition: text-shadow 0.5s;
            position: relative;
            z-index: 1;
            line-height: 1;
        }
        .timer-number.pulse {
            animation: numPulse 0.35s ease-out;
        }
        @keyframes numPulse {
            0% {
                transform: scale(1.18);
                text-shadow: 0 0 40px rgba(255, 220, 140, 1), 0 0 80px rgba(255, 180, 80, 0.8), 0 0 120px rgba(255, 140, 40, 0.5);
            }
            100% {
                transform: scale(1);
                text-shadow: 0 0 25px var(--card-glow, rgba(255, 180, 100, 0.7)), 0 0 50px var(--card-glow-2, rgba(255, 140, 60, 0.4)), 0 0 80px var(--card-glow-3, rgba(255, 120, 40, 0.2));
            }
        }

        .timer-label {
            font-size: clamp(11px, 2vw, 15px);
            font-weight: 500;
            color: rgba(255, 220, 190, 0.8);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }
        .timer-icon-label {
            display: inline-block;
            margin-right: 4px;
            font-size: clamp(14px, 2.4vw, 18px);
        }

        /* Кольори карток */
        .card-days {
            --card-glow: rgba(255, 180, 70, 0.7);
            --card-glow-2: rgba(255, 150, 40, 0.4);
            --card-glow-3: rgba(255, 120, 20, 0.2);
        }
        .card-hours {
            --card-glow: rgba(255, 160, 100, 0.7);
            --card-glow-2: rgba(255, 130, 60, 0.4);
            --card-glow-3: rgba(255, 100, 30, 0.2);
        }
        .card-minutes {
            --card-glow: rgba(255, 140, 130, 0.7);
            --card-glow-2: rgba(255, 110, 80, 0.4);
            --card-glow-3: rgba(255, 90, 50, 0.2);
        }
        .card-seconds {
            --card-glow: rgba(255, 120, 160, 0.75);
            --card-glow-2: rgba(255, 100, 120, 0.45);
            --card-glow-3: rgba(255, 80, 80, 0.25);
        }

        /* ===== ЦИТАТИ ===== */
        .quote-container {
            margin-top: clamp(24px, 4vh, 40px);
            text-align: center;
            min-height: clamp(50px, 8vh, 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: quoteEntrance 1s 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }
        @keyframes quoteEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .quote-text {
            font-size: clamp(14px, 2.5vw, 19px);
            font-style: italic;
            color: rgba(255, 220, 190, 0.85);
            letter-spacing: 0.03em;
            text-shadow: 0 0 16px rgba(255, 160, 80, 0.35);
            transition: opacity 0.7s ease, transform 0.7s ease;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.5;
        }
        .quote-text.fade-out {
            opacity: 0;
            transform: translateY(-12px);
        }
        .quote-text.fade-in {
            opacity: 1;
            transform: translateY(0);
        }
        .quote-author {
            display: block;
            font-size: clamp(11px, 1.8vw, 14px);
            font-style: normal;
            color: rgba(255, 200, 160, 0.6);
            margin-top: 6px;
            letter-spacing: 0.05em;
        }

        /* ===== ПРОГРЕС-БАР ===== */
        .progress-wrapper {
            margin-top: clamp(18px, 3vh, 28px);
            width: min(420px, 80vw);
            animation: quoteEntrance 1s 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 200, 160, 0.6);
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        .progress-bar-outer {
            width: 100%;
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        .progress-bar-inner {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #ff7eb3, #ff9a56, #ffb347, #ffcc70);
            background-size: 300% 100%;
            animation: progressShimmer 3s linear infinite;
            transition: width 0.6s ease;
            box-shadow: 0 0 12px rgba(255, 160, 60, 0.5);
        }
        @keyframes progressShimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 300% 50%;
            }
        }

        /* ===== ПІДПИС ВЧИТЕЛЯ ===== */
        .teacher-signature {
            margin-top: clamp(30px, 6vh, 48px);
            text-align: center;
            animation: signatureEntrance 1.4s 1s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            position: relative;
            z-index: 4;
            pointer-events: auto;
        }
        @keyframes signatureEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .signature-text {
            font-size: clamp(18px, 3.5vw, 26px);
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.05em;
            text-shadow:
                0 0 20px rgba(255, 200, 100, 0.6),
                0 0 40px rgba(255, 160, 60, 0.35),
                0 2px 8px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    rgba(255, 220, 160, 0.1) 40%,
                    rgba(255, 180, 100, 0.2) 100%);
            display: inline-block;
            padding: 12px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 200, 140, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .signature-text::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%,
                    rgba(255, 255, 255, 0.08) 0%,
                    transparent 55%);
            pointer-events: none;
            animation: signatureShine 3s ease-in-out infinite;
        }
        @keyframes signatureShine {
            0%,
            100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.7;
            }
        }
        .signature-text:hover {
            border-color: rgba(255, 220, 160, 0.6);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.45),
                0 0 50px rgba(255, 170, 60, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            transform: translateY(-3px);
        }
        .signature-emoji {
            display: inline-block;
            animation: iconBounce 2s ease-in-out infinite;
            margin: 0 6px;
            filter: drop-shadow(0 0 8px rgba(255, 200, 100, 0.6));
        }

        /* ===== ХВИЛЯ ===== */
        .wave-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 200%;
            z-index: 2;
            pointer-events: none;
            line-height: 0;
            opacity: 0.7;
        }
        .wave-container svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .wave-layer-1 {
            animation: waveDrift1 14s linear infinite;
        }
        .wave-layer-2 {
            animation: waveDrift2 10s linear infinite;
        }
        .wave-layer-3 {
            animation: waveDrift3 18s linear infinite;
        }
        @keyframes waveDrift1 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        @keyframes waveDrift2 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        @keyframes waveDrift3 {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* ===== АДАПТИВНІСТЬ ===== */
        @media (max-width: 768px) {
            .timer-grid {
                gap: 10px;
            }
            .timer-card {
                min-width: 65px;
                padding: 14px 12px;
                border-radius: 16px;
                border-width: 1.2px;
            }
            .timer-number {
                font-size: clamp(30px, 10vw, 50px);
            }
            .sun-glow {
                width: 220px;
                height: 220px;
                top: -80px;
            }
            .sun-core {
                width: 50px;
                height: 50px;
                top: 20px;
                box-shadow: 0 0 35px 18px rgba(255, 200, 100, 0.45), 0 0 70px 35px rgba(255, 160, 60, 0.2);
            }
            .wave-container {
                bottom: -10px;
            }
            .signature-text {
                font-size: 16px;
                padding: 10px 20px;
            }
        }
        @media (max-width: 420px) {
            .timer-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                width: 100%;
                max-width: 300px;
            }
            .timer-card {
                min-width: unset;
                padding: 12px 8px;
                border-radius: 14px;
            }
            .timer-number {
                font-size: clamp(26px, 11vw, 40px);
            }
            .timer-label {
                font-size: 10px;
                letter-spacing: 0.05em;
            }
            .main-title {
                font-size: 18px;
            }
            .title-icon {
                font-size: 32px;
            }
            .sun-glow {
                width: 160px;
                height: 160px;
                top: -50px;
            }
            .sun-core {
                width: 36px;
                height: 36px;
                top: 28px;
                box-shadow: 0 0 25px 12px rgba(255, 200, 100, 0.4), 0 0 50px 20px rgba(255, 160, 60, 0.15);
            }
            .signature-text {
                font-size: 14px;
                padding: 8px 16px;
                border-radius: 30px;
            }
        }
        @media (min-width: 1400px) {
            .timer-card {
                min-width: 150px;
                padding: 36px 32px;
            }
            .timer-number {
                font-size: 80px;
            }
            .timer-label {
                font-size: 17px;
            }
            .sun-glow {
                width: 420px;
                height: 420px;
                top: -150px;
            }
            .sun-core {
                width: 100px;
                height: 100px;
                top: 0;
            }
            .signature-text {
                font-size: 30px;
                padding: 16px 36px;
            }
        }
    </style>
</head>
<body>

    <!-- Фон -->
    <div class="bg-sky"></div>

    <!-- Сонце -->
    <div class="sun-glow"></div>
    <div class="sun-core"></div>

    <!-- Зірки -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Канвас для спалахів -->
    <canvas id="particlesCanvas"></canvas>

    <!-- Плаваючі емоджі (контейнер) -->
    <div id="floatingEmojisContainer"></div>

    <!-- Хвилі -->
    <div class="wave-container">
        <svg viewBox="0 0 2400 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Шар 1 -->
            <g class="wave-layer-1">
                <path d="M0,80 C200,120 400,20 600,60 C800,100 1000,30 1200,70 C1400,110 1600,40 1800,55 C2000,70 2200,25 2400,65 L2400,160 L0,160 Z"
                fill="rgba(255,140,80,0.18)" />
            </g>
            <!-- Шар 2 -->
            <g class="wave-layer-2">
                <path d="M0,95 C180,55 360,115 540,85 C720,55 900,105 1080,80 C1260,55 1440,100 1620,75 C1800,50 1980,90 2160,70 C2340,50 2400,85 2400,85 L2400,160 L0,160 Z"
                fill="rgba(255,180,120,0.15)" />
            </g>
            <!-- Шар 3 -->
            <g class="wave-layer-3">
                <path d="M0,110 C220,80 440,125 660,100 C880,75 1100,115 1320,95 C1540,75 1760,110 1980,90 C2200,70 2400,105 2400,105 L2400,160 L0,160 Z"
                fill="rgba(255,120,140,0.12)" />
            </g>
        </svg>
    </div>

    <!-- Основний контент -->
    <div class="main-container">
        <!-- Заголовок -->
        <div class="title-wrapper">
            <span class="title-icon">☀️</span>
            <h1 class="main-title">До літа залишилось</h1>
            <p class="summer-date-label" id="summerDateLabel">1 червня 2026 року</p>
        </div>

        <!-- Таймер -->
        <div class="timer-grid">
            <div class="timer-card card-days">
                <div class="timer-number" id="days">00</div>
                <div class="timer-label"><span class="timer-icon-label">📅</span> Днів</div>
            </div>
            <div class="timer-card card-hours">
                <div class="timer-number" id="hours">00</div>
                <div class="timer-label"><span class="timer-icon-label">⏰</span> Годин</div>
            </div>
            <div class="timer-card card-minutes">
                <div class="timer-number" id="minutes">00</div>
                <div class="timer-label"><span class="timer-icon-label">⏱️</span> Хвилин</div>
            </div>
            <div class="timer-card card-seconds">
                <div class="timer-number" id="seconds">00</div>
                <div class="timer-label"><span class="timer-icon-label">⚡</span> Секунд</div>
            </div>
        </div>

        <!-- Цитати -->
        <div class="quote-container">
            <p class="quote-text fade-in" id="quoteText">
                <span id="quoteContent">Кожен день наближає тебе до мрії. Не зупиняйся!</span>
            </p>
        </div>

        <!-- Прогрес-бар -->
        <div class="progress-wrapper">
            <div class="progress-info">
                <span>📊 Прогрес до літа</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-outer">
                <div class="progress-bar-inner" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>

        <!-- Підпис вчителя -->
        <div class="teacher-signature">
            <p class="signature-text">
                <span class="signature-emoji">🌟</span> З найкращими побажаннями, ваш вчитель Мирослав Романович <span class="signature-emoji">🌟</span>
            </p>
        </div>
    </div>

    <script>
        (function() {
            // ==================== НАЛАШТУВАННЯ ДАТИ ЛІТА ====================
            const now = new Date();
            const currentYear = now.getFullYear();
            let summerDate = new Date(currentYear, 5, 1, 0, 0, 0, 0); // 1 червня
            if (now >= summerDate) {
                summerDate = new Date(currentYear + 1, 5, 1, 0, 0, 0, 0);
            }

            // Для прогрес-бару: початок відліку — 1 вересня попереднього року (початок навчального року)
            const progressStartDate = new Date(summerDate.getFullYear() - 1, 8, 1, 0, 0, 0, 0); // 1 вересня
            const totalProgressMs = summerDate.getTime() - progressStartDate.getTime();

            // Відображення дати
            const months = [
                'січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
                'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'
            ];
            document.getElementById('summerDateLabel').textContent =
                `${summerDate.getDate()} ${months[summerDate.getMonth()]} ${summerDate.getFullYear()} року`;

            // ==================== DOM ЕЛЕМЕНТИ ====================
            const daysEl = document.getElementById('days');
            const hoursEl = document.getElementById('hours');
            const minutesEl = document.getElementById('minutes');
            const secondsEl = document.getElementById('seconds');
            const quoteContent = document.getElementById('quoteContent');
            const quoteText = document.getElementById('quoteText');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');

            // ==================== ЦИТАТИ ====================
            const quotes = [
                { text: 'Кожен день наближає тебе до мрії. Не зупиняйся!', author: '' },
                { text: 'Літо — це час, коли світ розквітає у всіх барвах', author: '' },
                { text: 'Залишилось зовсім трохи! Тепло вже близько ☀️', author: '' },
                { text: 'Найкраще попереду! Вір у себе та свої сили', author: '' },
                { text: 'Відчуй наближення сонця — воно вже поряд', author: '' },
                { text: 'Твоя праця зараз — це твій успіх влітку', author: '' },
                { text: 'Канікули чекають на тебе! Залишився останній ривок', author: '' },
                { text: 'Мрій масштабно, дій сміливо, відпочивай яскраво!', author: '' },
                { text: 'Сонце, море, друзі — все це зовсім скоро', author: '' },
                { text: 'Ти — неймовірний! І літо буде неймовірним теж', author: '' },
                { text: 'Кожна секунда наближає момент свободи', author: '' },
                { text: 'Пам\'ятай: після дощу завжди виходить сонце', author: '' },
            ];
            let quoteIndex = 0;
            let quoteInterval;

            function rotateQuote() {
                quoteText.classList.add('fade-out');
                setTimeout(() => {
                    quoteIndex = (quoteIndex + 1) % quotes.length;
                    const q = quotes[quoteIndex];
                    quoteContent.textContent = q.text;
                    quoteText.classList.remove('fade-out');
                    quoteText.classList.add('fade-in');
                    setTimeout(() => {
                        quoteText.classList.remove('fade-in');
                    }, 700);
                }, 700);
            }
            quoteInterval = setInterval(rotateQuote, 6000);

            // ==================== ТАЙМЕР ====================
            let prevSeconds = -1;

            function pad(num) {
                return String(num).padStart(2, '0');
            }

            function updateTimer() {
                const nowTime = new Date().getTime();
                const diff = summerDate.getTime() - nowTime;

                if (diff <= 0) {
                    daysEl.textContent = '00';
                    hoursEl.textContent = '00';
                    minutesEl.textContent = '00';
                    secondsEl.textContent = '00';
                    quoteContent.textContent = '🎉 Літо настало! Насолоджуйся кожною миттю!';
                    progressBar.style.width = '100%';
                    progressPercent.textContent = '100%';
                    clearInterval(quoteInterval);
                    return;
                }

                const totalSeconds = Math.floor(diff / 1000);
                const d = Math.floor(totalSeconds / 86400);
                const h = Math.floor((totalSeconds % 86400) / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                const s = totalSeconds % 60;

                daysEl.textContent = pad(d);
                hoursEl.textContent = pad(h);
                minutesEl.textContent = pad(m);
                secondsEl.textContent = pad(s);

                // Пульс на секундах
                if (s !== prevSeconds && prevSeconds !== -1) {
                    secondsEl.classList.remove('pulse');
                    void secondsEl.offsetWidth;
                    secondsEl.classList.add('pulse');
                }
                prevSeconds = s;

                // Прогрес-бар
                const elapsed = nowTime - progressStartDate.getTime();
                const progress = Math.min(100, Math.max(0, Math.round((elapsed / totalProgressMs) * 100)));
                progressBar.style.width = progress + '%';
                progressPercent.textContent = progress + '%';
            }

            updateTimer();
            const timerInterval = setInterval(updateTimer, 1000);

            // ==================== ЗІРКИ (CSS) ====================
            const starsContainer = document.getElementById('starsContainer');
            const starCount = 70;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1.2;
                star.style.setProperty('--size', size + 'px');
                star.style.setProperty('--top', Math.random() * 100 + '%');
                star.style.setProperty('--left', Math.random() * 100 + '%');
                star.style.setProperty('--duration', (Math.random() * 4 + 2.5) + 's');
                star.style.setProperty('--delay', (Math.random() * 6) + 's');
                star.style.setProperty('--glow-radius', (size * 4) + 'px');
                star.style.setProperty('--glow-spread', (size * 1.5) + 'px');
                starsContainer.appendChild(star);
            }

            // ==================== КАНВАС ЧАСТИНКИ ====================
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            const maxParticles = 55;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            class Particle {
                constructor() {
                    this.reset();
                    this.y = Math.random() * canvas.height;
                }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + Math.random() * 100;
                    this.size = Math.random() * 2.2 + 0.6;
                    this.speedY = -(Math.random() * 1.2 + 0.4);
                    this.speedX = (Math.random() - 0.5) * 0.5;
                    this.opacity = Math.random() * 0.7 + 0.3;
                    this.flickerSpeed = Math.random() * 0.03 + 0.01;
                    this.flickerOffset = Math.random() * Math.PI * 2;
                    this.hue = Math.random() < 0.5 ?
                        Math.random() * 20 + 30 : // золотистий
                        Math.random() * 20 + 340; // рожево-червоний
                }
                update() {
                    this.y += this.speedY;
                    this.x += this.speedX;
                    this.opacity += Math.sin(Date.now() * this.flickerSpeed + this.flickerOffset) * 0.015;
                    this.opacity = Math.max(0.15, Math.min(0.9, this.opacity));
                    if (this.y < -40 || this.x < -40 || this.x > canvas.width + 40) {
                        this.reset();
                        this.y = canvas.height + Math.random() * 60;
                    }
                }
                draw(ctx) {
                    ctx.save();
                    ctx.globalAlpha = this.opacity;
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                    gradient.addColorStop(0, `hsla(${this.hue}, 90%, 75%, 1)`);
                    gradient.addColorStop(0.4, `hsla(${this.hue}, 80%, 60%, 0.5)`);
                    gradient.addColorStop(1, 'transparent');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                    ctx.fill();
                    // Яскраве ядро
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 85%, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < maxParticles; i++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.update();
                    p.draw(ctx);
                });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();

            // ==================== ПЛАВАЮЧІ ЕМОДЖІ ====================
            const emojisContainer = document.getElementById('floatingEmojisContainer');
            const summerEmojis = ['☀️', '🌴', '🌊', '🏖️', '🍦', '🌺', '🦋', '😎', '⭐', '🌈', '🍉', '🏄', '🌅', '💫', '🎵',
                '🔥', '✨', '🕶️', '🌻', '🍹'
            ];
            const emojiElements = [];

            function createFloatingEmoji() {
                const el = document.createElement('span');
                el.classList.add('floating-emoji');
                el.textContent = summerEmojis[Math.floor(Math.random() * summerEmojis.length)];
                const size = Math.random() * 22 + 16;
                el.style.setProperty('--emoji-size', size + 'px');
                el.style.setProperty('--float-duration', (Math.random() * 12 + 10) + 's');
                el.style.setProperty('--float-delay', (Math.random() * 10) + 's');
                el.style.setProperty('--float-left', (Math.random() * 92) + '%');
                emojisContainer.appendChild(el);
                emojiElements.push({ el, duration: parseFloat(el.style.getPropertyValue('--float-duration')) *
                        1000 });
            }

            // Створюємо початкові емоджі
            const initialEmojiCount = 14;
            for (let i = 0; i < initialEmojiCount; i++) {
                const el = document.createElement('span');
                el.classList.add('floating-emoji');
                el.textContent = summerEmojis[Math.floor(Math.random() * summerEmojis.length)];
                const size = Math.random() * 22 + 16;
                el.style.setProperty('--emoji-size', size + 'px');
                el.style.setProperty('--float-duration', (Math.random() * 12 + 10) + 's');
                el.style.setProperty('--float-delay', (Math.random() * 10) + 's');
                el.style.setProperty('--float-left', (Math.random() * 92) + '%');
                emojisContainer.appendChild(el);
                emojiElements.push({ el, duration: parseFloat(el.style.getPropertyValue('--float-duration')) * 1000 });
            }

            // Періодично додаємо нові
            setInterval(() => {
                // Видаляємо старі (більше 18 елементів)
                while (emojiElements.length > 18) {
                    const old = emojiElements.shift();
                    if (old && old.el.parentNode) {
                        old.el.remove();
                    }
                }
                createFloatingEmoji();
            }, 3500);

            // ==================== ОБРОБКА ЗМІНИ РОЗМІРУ ВІКНА ====================
            window.addEventListener('resize', () => {
                resizeCanvas();
            });

            // ==================== ЗАПОБІГАННЯ ВИТОКУ ПАМ'ЯТІ ====================
            window.addEventListener('beforeunload', () => {
                clearInterval(timerInterval);
                clearInterval(quoteInterval);
            });

            console.log('🌞 Таймер до літа готовий! Літо настане:',
                summerDate.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' }));
            console.log('✨ Залишилось днів:', Math.ceil((summerDate.getTime() - Date.now()) / 86400000));
        })();
    </script>
</body>
</html>
